<text x="475.0" y="252.4985" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.5" font-weight="400" fill="#22313d" text-anchor="middle">按批次推进实例</text>
<text x="475.0" y="265.49850000000004" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.5" font-weight="400" fill="#22313d" text-anchor="middle">由 health signal 控制门槛</text>
<text x="475.0" y="278.49850000000004" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.5" font-weight="400" fill="#22313d" text-anchor="middle">具体组合需核对支持矩阵</text>
