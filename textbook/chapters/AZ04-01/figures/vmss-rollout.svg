<rect x="400" y="42" width="150" height="70" rx="8" ry="8" fill="#fdf1e3" stroke="#e0954a" stroke-width="1.4"/>
<text x="475.0" y="66.7435" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.3" font-weight="700" fill="#9a5a1c" text-anchor="middle">Manual</text>
<text x="475.0" y="82.99849999999999" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.7" font-weight="400" fill="#22313d" text-anchor="middle">现有实例等显式更新</text>
<text x="475.0" y="95.99849999999999" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.7" font-weight="400" fill="#22313d" text-anchor="middle">新实例使用 v5</text>
