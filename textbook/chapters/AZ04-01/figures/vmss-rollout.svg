<text x="475.0" y="166.9985" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.7" font-weight="400" fill="#22313d" text-anchor="middle">不保证实例顺序</text>
<text x="475.0" y="179.9985" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.7" font-weight="400" fill="#22313d" text-anchor="middle">可能同时影响多台</text>
