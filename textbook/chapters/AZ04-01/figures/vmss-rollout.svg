<text x="38" y="346.6" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.0" font-weight="400" fill="#22313d" text-anchor="start">图示解释模型和实例版本，不保证任意 mode/API 组合均支持相同策略。</text>
<text x="38" y="358.20000000000005" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.0" font-weight="400" fill="#22313d" text-anchor="start">部署前核对 orchestration、API、upgrade policy 与 health configuration。</text>
