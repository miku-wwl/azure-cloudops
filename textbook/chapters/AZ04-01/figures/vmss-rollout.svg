<text x="659.0" y="252.305" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.2" font-weight="400" fill="#22313d" text-anchor="middle">Flexible：Extension</text>
<text x="659.0" y="265.305" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.2" font-weight="400" fill="#22313d" text-anchor="middle">Uniform：Extension / LB probe</text>
<text x="659.0" y="278.305" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.2" font-weight="400" fill="#22313d" text-anchor="middle">与 PowerState 分开</text>
