<text x="380" y="355" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.1" font-weight="400" fill="#5d6d7a" text-anchor="middle">Host cache 会改变 I/O path；多盘总额、burst、队列不在此单盘教学模型内。</text>
