<text x="380" y="336" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.2" font-weight="400" fill="#c0504d" text-anchor="middle">NotActions and NotDataActions subtract within one role definition; a separate role assignment can still grant the operation.</text>
