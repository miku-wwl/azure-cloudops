<text x="600" y="497" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">event time · collection/ingestion time · UTC offset · source/schema · resource scope · operation ID · sampling · query window</text>
