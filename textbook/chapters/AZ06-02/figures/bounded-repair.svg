<text x="452" y="185" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">payments-mi-v2</text>
<text x="452" y="208" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">Blob Data Reader</text>
<rect x="614" y="126" width="245" height="124" rx="16" fill="#f2edfb" stroke="#684bb1" stroke-width="2.5"/>
<text x="736" y="157" font-family="Aptos,Arial,sans-serif" font-size="20" font-weight="700" fill="#684bb1" text-anchor="middle">3 · 锁定 scope</text>
<text x="736" y="185" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">rates container</text>
<text x="736" y="208" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">不扩大到账户/订阅</text>
<rect x="898" y="126" width="245" height="124" rx="16" fill="#eaf1f8" stroke="#17324d" stroke-width="2.5"/>
<text x="1020" y="157" font-family="Aptos,Arial,sans-serif" font-size="20" font-weight="700" fill="#17324d" text-anchor="middle">4 · 原路径验证</text>
<text x="1020" y="185" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">同 transfer + 幂等键</text>
<text x="1020" y="208" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">API 与 storage 成功</text>
<path d="M291,187 L320,187" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M575,187 L604,187" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M859,187 L888,187" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="47" y="310" width="515" height="161" rx="16" fill="#eaf6ef" stroke="#23764d" stroke-width="2.5"/>
<text x="304" y="346" font-family="Aptos,Arial,sans-serif" font-size="20" font-weight="700" fill="#23764d" text-anchor="middle">必须通过</text>
