<text x="168" y="208" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">保存版本 / 主体 / 证据</text>
<rect x="330" y="126" width="245" height="124" rx="16" fill="#eaf6ef" stroke="#23764d" stroke-width="2.5"/>
