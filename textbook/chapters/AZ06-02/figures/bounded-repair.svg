<text x="304" y="450" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">5 分钟稳定 + 队列回落</text>
<rect x="638" y="310" width="515" height="161" rx="16" fill="#fff0f1" stroke="#aa4052" stroke-width="2.5"/>
<text x="895" y="346" font-family="Aptos,Arial,sans-serif" font-size="20" font-weight="700" fill="#aa4052" text-anchor="middle">必须拒绝</text>
