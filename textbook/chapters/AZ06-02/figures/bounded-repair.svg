<text x="895" y="450" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">改了多项还无法定位效果</text>
<text x="600" y="535" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="700" fill="#aa4052" text-anchor="middle">任一数据、安全或同探针断言失败 → 保持未恢复，按预案回滚/继续遏制。</text>
