<text x="267" y="550" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="start">匹配 service/region/time</text>
<rect x="610" y="516" width="410" height="91" fill="#ffffff" stroke="#c8d3dc"/>
<text x="627" y="550" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="start">快照无匹配事件</text>
<rect x="1025" y="516" width="130" height="91" fill="#f2edfb" stroke="#c8d3dc"/>
<text x="1090" y="565" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="700" fill="#684bb1" text-anchor="middle">未知</text>
<text x="600" y="630" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="700" fill="#aa4052" text-anchor="middle">没有诊断设置 / trace 断链 / 数据未到达 → 未知，不是反证。</text>
</svg>