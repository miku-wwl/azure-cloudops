<text x="267" y="186" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="start">token 正确；数据权限缺失</text>
<rect x="610" y="152" width="410" height="91" fill="#ffffff" stroke="#c8d3dc"/>
<text x="627" y="186" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="start">Storage 403；principal=v2</text>
<text x="627" y="209" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="start">rates 无 reader 角色</text>
