<rect x="1025" y="334" width="130" height="91" fill="#fff3e5" stroke="#c8d3dc"/>
<text x="1090" y="383" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="700" fill="#c96a18" text-anchor="middle">削弱</text>
