<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#17324d"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="34" y="40" font-family="Aptos,Arial,sans-serif" font-size="27" font-weight="700" fill="#17324d" text-anchor="start">每个假设都必须预测一条能区分它的观测</text>
<text x="34" y="72" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="start">“支持 / 削弱 / 未知”比强行打分更诚实</text>
<rect x="48" y="110" width="200" height="42" fill="#eaf1f8" stroke="#b7c5d0"/>
<text x="148" y="138" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="middle">假设</text>
