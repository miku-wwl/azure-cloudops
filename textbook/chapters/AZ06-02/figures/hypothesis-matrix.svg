<text x="148" y="472" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="700" fill="#23764d" text-anchor="middle">数据库</text>
<rect x="250" y="425" width="355" height="91" fill="#ffffff" stroke="#c8d3dc"/>
<text x="267" y="459" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="start">SQL 依赖或账本约束失败</text>
<rect x="610" y="425" width="410" height="91" fill="#ffffff" stroke="#c8d3dc"/>
<text x="627" y="459" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="start">SQL 成功；账本 hash/行数稳定</text>
<rect x="1025" y="425" width="130" height="91" fill="#eaf6ef" stroke="#c8d3dc"/>
<text x="1090" y="474" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="700" fill="#23764d" text-anchor="middle">削弱</text>
<rect x="48" y="516" width="200" height="91" fill="#f2edfb" stroke="#c8d3dc"/>
<text x="148" y="563" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="700" fill="#684bb1" text-anchor="middle">平台事件</text>
