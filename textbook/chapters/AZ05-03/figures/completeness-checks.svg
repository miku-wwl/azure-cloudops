<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#17324d"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="34" y="42" font-family="Aptos,Arial,sans-serif" font-size="27" font-weight="700" fill="#17324d" text-anchor="start">资产清单的完整性要分别通过五项检查</text>
<text x="34" y="75" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="start">任何一项未知，都应把结论限定在已验证的 principal、scope 和读取时间</text>
<rect x="74" y="178" width="180" height="112" rx="16" fill="#f2edfb" stroke="#684bb1" stroke-width="2.5"/>
<text x="164" y="211" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#684bb1" text-anchor="middle">Scope</text>
<text x="164" y="243" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">tenant + subscription IDs</text>
<path d="M164,290 L600,372" fill="none" stroke="#684bb1" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<rect x="292" y="178" width="180" height="112" rx="16" fill="#edf5f7" stroke="#087f8c" stroke-width="2.5"/>
<text x="382" y="211" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#087f8c" text-anchor="middle">RBAC</text>
<text x="382" y="243" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">read visibility</text>
<path d="M382,290 L600,372" fill="none" stroke="#087f8c" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<rect x="510" y="178" width="180" height="112" rx="16" fill="#fff3e5" stroke="#c96a18" stroke-width="2.5"/>
<text x="600" y="211" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#c96a18" text-anchor="middle">Freshness</text>
<text x="600" y="243" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">index lag + query time</text>
<path d="M600,290 L600,372" fill="none" stroke="#c96a18" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<rect x="728" y="178" width="180" height="112" rx="16" fill="#eaf6ef" stroke="#23764d" stroke-width="2.5"/>
<text x="818" y="211" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#23764d" text-anchor="middle">Pagination</text>
<text x="818" y="243" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">all pages + token</text>
<path d="M818,290 L600,372" fill="none" stroke="#23764d" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<rect x="946" y="178" width="180" height="112" rx="16" fill="#eaf1f8" stroke="#17324d" stroke-width="2.5"/>
<text x="1036" y="211" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#17324d" text-anchor="middle">Repeatability</text>
<text x="1036" y="243" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">unique id + drift</text>
<path d="M1036,290 L600,372" fill="none" stroke="#17324d" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<rect x="330" y="372" width="540" height="110" rx="16" fill="#eaf1f8" stroke="#17324d" stroke-width="2.5"/>
<text x="600" y="405" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#17324d" text-anchor="middle">Evidence-backed inventory claim</text>
<text x="600" y="437" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">query version · scope manifest · timestamps</text>
<text x="600" y="462" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">page count · unique IDs · duplicates · exceptions</text>
<text x="600" y="540" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="700" fill="#aa4052" text-anchor="middle">没有独立的范围清单和权限证据时，“没有返回”不等于“资源不存在”。</text>
</svg>