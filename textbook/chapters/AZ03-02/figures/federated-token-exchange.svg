<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 395" width="760" height="395" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
<defs><marker id="marrowe0954a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#e0954a"/></marker><marker id="marrow2e7d55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#2e7d55"/></marker></defs>
<text x="380" y="23" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.8" font-weight="700" fill="#1d3b53" text-anchor="middle">Federation 接收外部 assertion，再签发面向目标 API 的 Entra access token</text>
<rect x="22" y="81" width="173" height="104" rx="8" ry="8" fill="#f2f5f7" stroke="#9fb3c1" stroke-width="1.4"/>
<text x="108.5" y="111.8025" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.5" font-weight="700" fill="#41525f" text-anchor="middle">External IdP</text>
<text x="108.5" y="131.1275" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.0" font-weight="400" fill="#5d6d7a" text-anchor="middle">GitHub / Kubernetes</text>
<text x="108.5" y="147.1275" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.0" font-weight="400" fill="#5d6d7a" text-anchor="middle">iss · sub · aud</text>
<text x="108.5" y="163.1275" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.0" font-weight="400" fill="#5d6d7a" text-anchor="middle">short-lived OIDC assertion</text>
<rect x="251" y="64" width="245" height="138" rx="8" ry="8" fill="#fdf1e3" stroke="#e0954a" stroke-width="1.4"/>
<text x="373.5" y="103.7435" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.3" font-weight="700" fill="#9a5a1c" text-anchor="middle">Federated credential</text>
<text x="373.5" y="122.99849999999999" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.8" font-weight="400" fill="#22313d" text-anchor="middle">issuer + subject + audience</text>
<text x="373.5" y="138.99849999999998" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.8" font-weight="400" fill="#22313d" text-anchor="middle">逐项精确、区分大小写匹配</text>
<text x="373.5" y="154.99849999999998" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.8" font-weight="400" fill="#22313d" text-anchor="middle">incoming aud: token exchange</text>
<text x="373.5" y="170.99849999999998" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.8" font-weight="400" fill="#22313d" text-anchor="middle">不保存 client secret</text>
<rect x="554" y="81" width="183" height="104" rx="8" ry="8" fill="#e9eff5" stroke="#1d3b53" stroke-width="1.4"/>
<text x="645.5" y="111.8025" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.5" font-weight="700" fill="#17384f" text-anchor="middle">Microsoft Entra ID</text>
<text x="645.5" y="131.1275" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.0" font-weight="400" fill="#22313d" text-anchor="middle">federated identity</text>
<text x="645.5" y="147.1275" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.0" font-weight="400" fill="#22313d" text-anchor="middle">exchange assertion</text>
<text x="645.5" y="163.1275" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.0" font-weight="400" fill="#22313d" text-anchor="middle">issue API token</text>
<path d="M195 132 L251 132" fill="none" stroke="#e0954a" stroke-width="1.6" marker-end="url(#marrowe0954a)" stroke-linejoin="round"/>
<path d="M496 132 L554 132" fill="none" stroke="#2e7d55" stroke-width="1.6" marker-end="url(#marrow2e7d55)" stroke-linejoin="round"/>
<rect x="488.953" y="115.065" width="72.09400000000001" height="9.49" rx="3" ry="3" fill="#ffffff" stroke="none" stroke-width="1.2" opacity="0.92"/>
<text x="525.0" y="122.0" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.3" font-weight="500" fill="#2e7d55" text-anchor="middle">trusted assertion</text>
<rect x="285" y="260" width="188" height="81" rx="8" ry="8" fill="#eaf5ee" stroke="#2e7d55" stroke-width="1.4"/>
<text x="379.0" y="287.273" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="700" fill="#1f5c3d" text-anchor="middle">Key Vault endpoint</text>
<text x="379.0" y="306.56300000000005" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.9" font-weight="400" fill="#22313d" text-anchor="middle">final aud = https://vault.azure.net</text>
<text x="379.0" y="322.56300000000005" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.9" font-weight="400" fill="#22313d" text-anchor="middle">then network + data authorization</text>
<path d="M646 185 L473 284" fill="none" stroke="#2e7d55" stroke-width="1.6" marker-end="url(#marrow2e7d55)" stroke-linejoin="round"/>
<rect x="512.6485" y="220.565" width="103.70299999999997" height="9.49" rx="3" ry="3" fill="#ffffff" stroke="none" stroke-width="1.2" opacity="0.92"/>
<text x="564.5" y="227.5" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.3" font-weight="500" fill="#2e7d55" text-anchor="middle">Entra-issued access token</text>
<text x="380" y="370" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.1" font-weight="400" fill="#c0504d" text-anchor="middle">外部 assertion 的 audience 说明 Entra 可接受什么输入；Entra access token 的 audience 说明哪个 API 可接收它。</text>
</svg>
