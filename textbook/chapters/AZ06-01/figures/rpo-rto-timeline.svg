<text x="34" y="42" font-family="Aptos,Arial,sans-serif" font-size="27" font-weight="700" fill="#17324d" text-anchor="start">RPO 和 RTO 的终点要按业务定义测量</text>
<text x="34" y="75" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="start">RPO 看故障时刻和数据恢复点；RTO 到数据与应用验证通过</text>
