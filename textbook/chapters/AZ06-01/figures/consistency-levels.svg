<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#17324d"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="34" y="42" font-family="Aptos,Arial,sans-serif" font-size="27" font-weight="700" fill="#17324d" text-anchor="start">快照一致性描述恢复起点，不是业务验收结果</text>
<text x="34" y="75" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="start">发生写入时刻、应用协调能力和恢复后的检查共同决定可用性</text>
<rect x="66" y="152" width="300" height="126" rx="16" fill="#eaf6ef" stroke="#23764d" stroke-width="2.5"/>
<text x="216" y="186" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#23764d" text-anchor="middle">Application-consistent</text>
<text x="216" y="218" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">VSS writer / Linux scripts</text>
<text x="216" y="243" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">flush or quiesce app state</text>
<rect x="450" y="152" width="300" height="126" rx="16" fill="#fff3e5" stroke="#c96a18" stroke-width="2.5"/>
<text x="600" y="186" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#c96a18" text-anchor="middle">File-system-consistent</text>
<text x="600" y="218" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">coherent file system</text>
<text x="600" y="243" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">application may need fix-up</text>
<rect x="834" y="152" width="300" height="126" rx="16" fill="#fff0f1" stroke="#aa4052" stroke-width="2.5"/>
<text x="984" y="186" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#aa4052" text-anchor="middle">Crash-consistent</text>
<text x="984" y="218" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">disk writes only</text>
<text x="984" y="243" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">memory / pending I/O may be lost</text>
<path d="M366,216 L440,216" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M750,216 L824,216" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="202" y="354" width="300" height="92" rx="16" fill="#eaf1f8" stroke="#17324d" stroke-width="2.5"/>
<text x="352" y="388" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#17324d" text-anchor="middle">Restore and boot</text>
<text x="352" y="420" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">job success ≠ app success</text>
<rect x="698" y="354" width="300" height="92" rx="16" fill="#f2edfb" stroke="#684bb1" stroke-width="2.5"/>
<text x="848" y="388" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#684bb1" text-anchor="middle">Application checks</text>
<text x="848" y="420" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">logs · DB integrity · transactions</text>
<path d="M502,400 L688,400" fill="none" stroke="#684bb1" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="510" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#17324d" text-anchor="middle">缺少更强的一致性时，使用原生恢复机制和业务不变量验证数据。</text>
</svg>