<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#17324d"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="34" y="42" font-family="Aptos,Arial,sans-serif" font-size="27" font-weight="700" fill="#17324d" text-anchor="start">从 recovery point 选择恢复位置，再定义校验关卡</text>
<text x="34" y="75" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="start">原位恢复会替换源磁盘；演练和调查通常需要替代目标</text>
<rect x="42" y="190" width="220" height="124" rx="16" fill="#f2edfb" stroke="#684bb1" stroke-width="2.5"/>
<text x="152" y="224" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#684bb1" text-anchor="middle">Choose recovery point</text>
<text x="152" y="256" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">timestamp + consistency</text>
<text x="152" y="281" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">snapshot tier / vault tier</text>
<rect x="348" y="118" width="250" height="112" rx="16" fill="#fff0f1" stroke="#aa4052" stroke-width="2.5"/>
<text x="473" y="152" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#aa4052" text-anchor="middle">OLR</text>
<text x="473" y="184" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">replace source OS + data disks</text>
<text x="473" y="209" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">approved production action</text>
<rect x="348" y="274" width="250" height="112" rx="16" fill="#edf5f7" stroke="#087f8c" stroke-width="2.5"/>
<text x="473" y="308" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#087f8c" text-anchor="middle">ALR / restore disks</text>
<text x="473" y="340" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">new target / custom VM</text>
<text x="473" y="365" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">isolate for recovery test</text>
<rect x="348" y="430" width="250" height="92" rx="16" fill="#fff3e5" stroke="#c96a18" stroke-width="2.5"/>
<text x="473" y="464" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#c96a18" text-anchor="middle">Item-level restore</text>
<text x="473" y="496" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">selected files / folders</text>
<rect x="710" y="188" width="430" height="138" rx="16" fill="#eaf6ef" stroke="#23764d" stroke-width="2.5"/>
<text x="925" y="222" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#23764d" text-anchor="middle">Verify before service</text>
<text x="925" y="254" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">data count / hash / DB checks</text>
<text x="925" y="279" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">identity · DNS · dependency</text>
<text x="925" y="304" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">business write/read probe</text>
<path d="M262,248 L338,174" fill="none" stroke="#aa4052" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M262,252 L338,330" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M262,254 L338,474" fill="none" stroke="#c96a18" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M598,174 L700,216" fill="none" stroke="#aa4052" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M598,330 L700,252" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M598,474 L700,300" fill="none" stroke="#c96a18" stroke-width="3" marker-end="url(#arrow)"/>
<text x="925" y="398" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="700" fill="#17324d" text-anchor="middle">选择的目标决定是否覆盖生产写入、身份或网络。</text>
<text x="925" y="437" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="middle">记录时间、作业结果、校验输出和清理残留。</text>
</svg>