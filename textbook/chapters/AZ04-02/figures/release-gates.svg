<text x="106.0" y="276.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.5" font-weight="400" fill="#5d6d7a" text-anchor="middle">目标 replicas 满足</text>
<text x="106.0" y="288.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.5" font-weight="400" fill="#5d6d7a" text-anchor="middle">min / max 与 workload</text>
<rect x="220" y="222" width="156" height="92" rx="8" ry="8" fill="#fdf1e3" stroke="#e0954a" stroke-width="1.4"/>
<text x="298.0" y="259.6875" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#9a5a1c" text-anchor="middle">Startup + readiness</text>
<text x="298.0" y="276.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.5" font-weight="400" fill="#22313d" text-anchor="middle">所有 replicas 通过</text>
<text x="298.0" y="288.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.5" font-weight="400" fill="#22313d" text-anchor="middle">revision 才算 ready</text>
<rect x="412" y="222" width="145" height="92" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="484.5" y="253.6875" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#12676b" text-anchor="middle">Revision mode</text>
<text x="484.5" y="270.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.0" font-weight="400" fill="#22313d" text-anchor="middle">single：ready 后自动切流</text>
<text x="484.5" y="282.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.0" font-weight="400" fill="#22313d" text-anchor="middle">multiple：label 定向测试</text>
<text x="484.5" y="294.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.0" font-weight="400" fill="#22313d" text-anchor="middle">再由人设置 weights</text>
<rect x="594" y="222" width="138" height="92" rx="8" ry="8" fill="#f1edf8" stroke="#6f55a8" stroke-width="1.4"/>
<text x="663.0" y="253.6875" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#4f3a86" text-anchor="middle">Smoke / SLI</text>
<text x="663.0" y="270.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.0" font-weight="400" fill="#22313d" text-anchor="middle">关键请求与依赖</text>
<text x="663.0" y="282.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.0" font-weight="400" fill="#22313d" text-anchor="middle">single 切流后验证</text>
<text x="663.0" y="294.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.0" font-weight="400" fill="#22313d" text-anchor="middle">multiple 可先走 label</text>
