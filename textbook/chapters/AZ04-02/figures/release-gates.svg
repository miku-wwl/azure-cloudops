<rect x="28" y="330" width="704" height="38" rx="5" ry="5" fill="#fdf1e3" stroke="#e0954a" stroke-width="1" stroke-dasharray="4 3"/>
<text x="36" y="343.4" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.4" font-weight="700" fill="#9a5a1c" text-anchor="start">Release boundary</text>
<text x="36" y="354.13" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.4" font-weight="400" fill="#22313d" text-anchor="start">single mode 没有独立人工 gate 插入 readiness 与自动切流之间；multiple mode 可用 label 直连候选 revision。</text>
<rect x="144" y="382" width="472" height="40" rx="8" ry="8" fill="#fbeceb" stroke="#c0504d" stroke-width="1.4"/>
<text x="380.0" y="398.9485" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.3" font-weight="700" fill="#8e2f2c" text-anchor="middle">Runtime liveness</text>
<text x="380.0" y="412.85350000000005" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.2" font-weight="400" fill="#22313d" text-anchor="middle">持续运行期观察；endpoint 仍不能替代完整业务交易与 SLI。</text>
