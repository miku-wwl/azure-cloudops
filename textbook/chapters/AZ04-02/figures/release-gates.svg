<text x="380" y="22" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#1d3b53" text-anchor="middle">平台就绪门、业务验证门和运行期健康门不能合并</text>
<text x="28" y="60" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.8" font-weight="700" fill="#1d3b53" text-anchor="start">App Service</text>
<rect x="28" y="76" width="156" height="86" rx="8" ry="8" fill="#fdf1e3" stroke="#e0954a" stroke-width="1.4"/>
<text x="106.0" y="110.6875" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#9a5a1c" text-anchor="middle">Restart + warm-up</text>
<text x="106.0" y="127.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.5" font-weight="400" fill="#22313d" text-anchor="middle">每个 source instance</text>
<text x="106.0" y="139.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.5" font-weight="400" fill="#22313d" text-anchor="middle">status filter 可设</text>
<rect x="220" y="76" width="156" height="86" rx="8" ry="8" fill="#f1edf8" stroke="#6f55a8" stroke-width="1.4"/>
<text x="298.0" y="110.6875" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#4f3a86" text-anchor="middle">Swap preview</text>
<text x="298.0" y="127.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.3" font-weight="400" fill="#22313d" text-anchor="middle">production 配置下验证</text>
<text x="298.0" y="139.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.3" font-weight="400" fill="#22313d" text-anchor="middle">site authentication 有限制</text>
<rect x="412" y="76" width="145" height="86" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="484.5" y="110.6875" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#12676b" text-anchor="middle">Swap route</text>
<text x="484.5" y="127.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.5" font-weight="400" fill="#22313d" text-anchor="middle">Production hostname</text>
<text x="484.5" y="139.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.5" font-weight="400" fill="#22313d" text-anchor="middle">切到候选 app</text>
<rect x="594" y="76" width="138" height="86" rx="8" ry="8" fill="#eaf5ee" stroke="#2e7d55" stroke-width="1.4"/>
<text x="663.0" y="110.6875" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#1f5c3d" text-anchor="middle">Health Check</text>
<text x="663.0" y="127.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.3" font-weight="400" fill="#22313d" text-anchor="middle">持续按 instance 探测</text>
<text x="663.0" y="139.0625" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.3" font-weight="400" fill="#22313d" text-anchor="middle">不是 swap warm-up</text>
