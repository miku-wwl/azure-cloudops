<text x="380" y="22" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#1d3b53" text-anchor="middle">已建立连接有 flow state；过滤诊断与端到端探测回答不同问题</text>
<rect x="22" y="74" width="155" height="62" rx="8" ry="8" fill="#e9eff5" stroke="#1d3b53" stroke-width="1.4"/>
