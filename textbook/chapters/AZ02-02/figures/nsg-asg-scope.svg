<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="760" height="332" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
<defs><marker id="marrow2e7d55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#2e7d55"/></marker><marker id="marrowc0504d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#c0504d"/></marker></defs>
<text x="380" y="22" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#1d3b53" text-anchor="middle">同一入站流量要通过 subnet NSG 与 NIC NSG；ASG 表示 NIC 角色</text>
<rect x="24" y="112" width="126" height="64" rx="8" ry="8" fill="#e9eff5" stroke="#1d3b53" stroke-width="1.4"/>
<text x="87.0" y="135.129" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="700" fill="#17384f" text-anchor="middle">Edge proxy</text>
<text x="87.0" y="150.063" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.2" font-weight="400" fill="#22313d" text-anchor="middle">NIC ∈ ASG-Edge</text>
<text x="87.0" y="161.707" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.2" font-weight="400" fill="#22313d" text-anchor="middle">10.40.1.20</text>
<rect x="190" y="75" width="198" height="138" rx="8" ry="8" fill="#eaf5ee" stroke="#2e7d55" stroke-width="1.4"/>
<text x="289.0" y="128.845" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="700" fill="#1f5c3d" text-anchor="middle">Subnet NSG</text>
<text x="289.0" y="144.415" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.5" font-weight="400" fill="#22313d" text-anchor="middle">110 Allow Edge → API</text>
<text x="289.0" y="156.48499999999999" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.5" font-weight="400" fill="#22313d" text-anchor="middle">120 Deny other → API</text>
<text x="289.0" y="168.55499999999998" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.5" font-weight="400" fill="#22313d" text-anchor="middle">Both rules use TCP 8443</text>
<rect x="438" y="75" width="198" height="138" rx="8" ry="8" fill="#fbeceb" stroke="#c0504d" stroke-width="1.4"/>
<text x="537.0" y="128.845" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="700" fill="#8e2f2c" text-anchor="middle">NIC NSG</text>
<text x="537.0" y="144.415" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.5" font-weight="400" fill="#22313d" text-anchor="middle">100 Deny maintenance</text>
<text x="537.0" y="156.48499999999999" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.5" font-weight="400" fill="#22313d" text-anchor="middle">110 Allow Edge → API</text>
<text x="537.0" y="168.55499999999998" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.5" font-weight="400" fill="#22313d" text-anchor="middle">First matching rule wins</text>
<rect x="684" y="112" width="60" height="64" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="714.0" y="141.31799999999998" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="700" fill="#12676b" text-anchor="middle">API</text>
<text x="714.0" y="155.32999999999998" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.6" font-weight="400" fill="#22313d" text-anchor="middle">ASG-API</text>
<path d="M150 137 L190 137" fill="none" stroke="#2e7d55" stroke-width="1.6" marker-end="url(#marrow2e7d55)" stroke-linejoin="round"/>
<rect x="155.96" y="121.4" width="28.080000000000002" height="10.4" rx="3" ry="3" fill="#ffffff" stroke="none" stroke-width="1.2" opacity="0.92"/>
<text x="170.0" y="129.0" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8" font-weight="500" fill="#2e7d55" text-anchor="middle">allow</text>
<path d="M388 137 L438 137" fill="none" stroke="#2e7d55" stroke-width="1.6" marker-end="url(#marrow2e7d55)" stroke-linejoin="round"/>
<rect x="398.96" y="121.4" width="28.080000000000002" height="10.4" rx="3" ry="3" fill="#ffffff" stroke="none" stroke-width="1.2" opacity="0.92"/>
<text x="413.0" y="129.0" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8" font-weight="500" fill="#2e7d55" text-anchor="middle">allow</text>
<path d="M636 137 L684 137" fill="none" stroke="#c0504d" stroke-width="1.6" marker-end="url(#marrowc0504d)" stroke-linejoin="round"/>
<rect x="647.732" y="120.59" width="24.536" height="10.14" rx="3" ry="3" fill="#ffffff" stroke="none" stroke-width="1.2" opacity="0.92"/>
<text x="660.0" y="128.0" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.8" font-weight="500" fill="#c0504d" text-anchor="middle">deny</text>
<rect x="86" y="244" width="588" height="52" rx="8" ry="8" fill="#fdf1e3" stroke="#e0954a" stroke-width="1.4"/>
<text x="380.0" y="266.726" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="700" fill="#9a5a1c" text-anchor="middle">Effective view</text>
<text x="380.0" y="282.298" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.6" font-weight="400" fill="#22313d" text-anchor="middle">Inspect the rules at both scopes; priority 110 in one NSG does not cancel priority 100 in another.</text>
<text x="380" y="322" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.8" font-weight="400" fill="#5d6d7a" text-anchor="middle">ASG membership is on NICs; ASGs in one NSG rule must fit the documented same-VNet constraint.</text>
</svg>
