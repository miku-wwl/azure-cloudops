<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#17324d"/></marker></defs>
<text x="34" y="42" font-family="Aptos,Arial,sans-serif" font-size="27" font-weight="700" fill="#17324d" text-anchor="start">三层机制：语言与计划、Terraform Provider、ARM Resource Provider</text>
<text x="34" y="75" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="start">同叫 Provider 的组件不处在同一层；每层回答不同问题</text>
<rect x="55" y="139" width="310" height="152" rx="15" fill="#eaf1f8" stroke="#17324d" stroke-width="2.5"/>
<text x="210" y="173" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#17324d" text-anchor="middle">Terraform Core</text>
<text x="210" y="206" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">HCL · modules · dependency graph</text>
<text x="210" y="231" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">State address · Plan · lifecycle</text>
<rect x="445" y="139" width="310" height="152" rx="15" fill="#edf5f7" stroke="#087f8c" stroke-width="2.5"/>
<text x="600" y="173" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#087f8c" text-anchor="middle">Terraform Provider plugin</text>
<text x="600" y="206" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">AzureRM: typed resource schema</text>
<text x="600" y="231" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">AzAPI: ARM REST API + version/body</text>
<rect x="835" y="139" width="310" height="152" rx="15" fill="#fff3e5" stroke="#c96a18" stroke-width="2.5"/>
<text x="990" y="173" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#c96a18" text-anchor="middle">Azure ARM service</text>
<text x="990" y="206" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">Microsoft.Storage / Network / ...</text>
<text x="990" y="231" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">API namespace and remote resource</text>
<path d="M365,210 L435,210" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M755,210 L825,210" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="355" font-family="Aptos,Arial,sans-serif" font-size="20" font-weight="700" fill="#17324d" text-anchor="middle">Core plans an address; a Terraform Provider maps it to ARM operations.</text>
<text x="600" y="398" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#5d7183" text-anchor="middle">Azure Resource Provider is an ARM service namespace, not a Terraform plugin.</text>
</svg>