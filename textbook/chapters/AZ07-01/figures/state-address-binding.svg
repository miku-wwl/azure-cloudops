<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#17324d"/></marker></defs>
<text x="34" y="42" font-family="Aptos,Arial,sans-serif" font-size="27" font-weight="700" fill="#17324d" text-anchor="start">State 保存地址到远端对象的绑定</text>
<text x="34" y="75" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="start">读取当前对象后，漂移才会进入计划差异</text>
<rect x="58" y="166" width="298" height="126" rx="15" fill="#f2edfb" stroke="#684bb1" stroke-width="2.5"/>
<text x="207" y="200" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#684bb1" text-anchor="middle">Configuration address</text>
<text x="207" y="233" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">azurerm_storage_account.logs</text>
<text x="207" y="258" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">desired fields + provider</text>
<rect x="450" y="166" width="298" height="126" rx="15" fill="#eaf1f8" stroke="#17324d" stroke-width="2.5"/>
<text x="599" y="200" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#17324d" text-anchor="middle">Terraform State</text>
<text x="599" y="233" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">address → provider + remote ID</text>
<text x="599" y="258" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">one remote object, one address</text>
<rect x="842" y="166" width="298" height="126" rx="15" fill="#edf5f7" stroke="#087f8c" stroke-width="2.5"/>
<text x="991" y="200" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#087f8c" text-anchor="middle">Azure remote object</text>
<text x="991" y="233" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">ARM ID + observed attributes</text>
<text x="991" y="258" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">manual drift may exist</text>
<path d="M356,228 L440,228" fill="none" stroke="#684bb1" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M748,228 L832,228" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M842,277 L748,318" fill="none" stroke="#c96a18" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text x="598" y="371" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#c96a18" text-anchor="middle">Provider refresh → compare with configuration → proposed change</text>
<text x="600" y="440" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#5d7183" text-anchor="middle">State 是绑定与元数据；不是配置，也不是云资源本身。</text>
</svg>