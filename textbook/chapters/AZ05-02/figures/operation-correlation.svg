<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#17324d"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="34" y="42" font-family="Aptos,Arial,sans-serif" font-size="27" font-weight="700" fill="#17324d" text-anchor="start">OperationId 找到同一分布式操作；ParentId 检查直接调用关系</text>
<text x="34" y="74" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="start">workspace-based Application Insights 常用 AppRequests、AppDependencies 与 AppExceptions</text>
<rect x="397" y="116" width="406" height="110" rx="17" fill="#fff0f1" stroke="#aa4052" stroke-width="2.5"/>
<text x="600" y="150" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#aa4052" text-anchor="middle">AppRequests · Checkout API</text>
<text x="600" y="183" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">Id = req-17  ·  OperationId = op-7</text>
<text x="600" y="209" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">POST /checkout  ·  500</text>
<rect x="78" y="330" width="310" height="112" rx="17" fill="#fff3e5" stroke="#c96a18" stroke-width="2.5"/>
<text x="233" y="364" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#c96a18" text-anchor="middle">AppDependencies · SQL</text>
<text x="233" y="397" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">Id = dep-31  ·  OperationId = op-7</text>
<text x="233" y="423" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">ParentId = req-17  ·  failed</text>
<rect x="444" y="330" width="310" height="112" rx="17" fill="#f2edfb" stroke="#684bb1" stroke-width="2.5"/>
<text x="599" y="364" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#684bb1" text-anchor="middle">AppExceptions · API</text>
<text x="599" y="397" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">OperationId = op-7</text>
<text x="599" y="423" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">ParentId = req-17  ·  Timeout</text>
<rect x="834" y="330" width="310" height="112" rx="17" fill="#edf5f7" stroke="#087f8c" stroke-width="2.5"/>
<text x="989" y="364" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#087f8c" text-anchor="middle">Another component</text>
<text x="989" y="397" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">same OperationId</text>
<text x="989" y="423" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">a different role / span</text>
<path d="M490,226 L260,320" fill="none" stroke="#c96a18" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600,226 L600,320" fill="none" stroke="#684bb1" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M710,226 L980,320" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="494" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="700" fill="#17324d" text-anchor="middle">同一 OperationId 是关联线索；ParentId + Id 验证直接父子。不能只凭时间接近认定因果。</text>
<text x="600" y="532" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#5d7183" text-anchor="middle">采样、未插桩或过滤可能让某些 span 缺席；图中的连线不是完整性保证。</text>
</svg>