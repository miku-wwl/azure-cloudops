<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#17324d"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="34" y="42" font-family="Aptos,Arial,sans-serif" font-size="27" font-weight="700" fill="#17324d" text-anchor="start">三条采集路径进入同一 Log Analytics workspace</text>
<text x="34" y="74" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="start">原创配置示意 · 先认采集配置归属，再用记录所在表和资源 ID 验证</text>
<rect x="32" y="108" width="260" height="105" rx="17" fill="#edf5f7" stroke="#087f8c" stroke-width="2.5"/>
<text x="162" y="142" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#087f8c" text-anchor="middle">VM 的性能计数器</text>
<text x="162" y="175" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">AMA 扩展采集</text>
<rect x="32" y="255" width="260" height="105" rx="17" fill="#fff3e5" stroke="#c96a18" stroke-width="2.5"/>
<text x="162" y="289" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#c96a18" text-anchor="middle">Blob service 资源日志</text>
<text x="162" y="322" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">平台产生操作记录</text>
<rect x="32" y="402" width="260" height="105" rx="17" fill="#f2edfb" stroke="#684bb1" stroke-width="2.5"/>
<text x="162" y="436" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#684bb1" text-anchor="middle">应用请求</text>
<text x="162" y="469" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">OpenTelemetry 插桩与导出</text>
<rect x="345" y="108" width="340" height="105" rx="17" fill="#edf5f7" stroke="#087f8c" stroke-width="2.5"/>
<text x="515" y="142" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#087f8c" text-anchor="middle">按 DCR 采集并路由</text>
<text x="515" y="175" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">DCRA 把规则关联到 VM</text>
<rect x="345" y="255" width="340" height="105" rx="17" fill="#fff3e5" stroke="#c96a18" stroke-width="2.5"/>
<text x="515" y="289" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#c96a18" text-anchor="middle">Diagnostic settings</text>
<text x="515" y="322" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">选类别与 workspace 目标</text>
<rect x="345" y="402" width="340" height="105" rx="17" fill="#f2edfb" stroke="#684bb1" stroke-width="2.5"/>
<text x="515" y="436" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#684bb1" text-anchor="middle">Application Insights</text>
<text x="515" y="469" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">应用资源链接日志工作区</text>
<rect x="758" y="93" width="408" height="429" rx="20" fill="#f5f8fb" stroke="#17324d" stroke-width="2.5"/>
<text x="962" y="124" font-family="Aptos,Arial,sans-serif" font-size="23" font-weight="700" fill="#17324d" text-anchor="middle">Log Analytics workspace</text>
<rect x="790" y="137" width="344" height="75" rx="17" fill="#ffffff" stroke="#087f8c" stroke-width="2.5"/>
<text x="962" y="171" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#087f8c" text-anchor="middle">Perf</text>
<text x="962" y="204" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">读资源 ID、counter、时间</text>
<rect x="790" y="270" width="344" height="75" rx="17" fill="#ffffff" stroke="#c96a18" stroke-width="2.5"/>
<text x="962" y="304" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#c96a18" text-anchor="middle">StorageBlobLogs</text>
<text x="962" y="337" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">示例：服务专用表模式</text>
<rect x="790" y="417" width="344" height="75" rx="17" fill="#ffffff" stroke="#684bb1" stroke-width="2.5"/>
<text x="962" y="451" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#684bb1" text-anchor="middle">AppRequests 等</text>
<text x="962" y="484" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#273b4d" text-anchor="middle">按角色、操作 ID 和时间筛选</text>
<path d="M292,160 L335,160" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M685,160 L782,160" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M292,307 L335,307" fill="none" stroke="#c96a18" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M685,307 L782,307" fill="none" stroke="#c96a18" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M292,454 L335,454" fill="none" stroke="#684bb1" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M685,454 L782,454" fill="none" stroke="#684bb1" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="554" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="400" fill="#5d7183" text-anchor="middle">DCE 在相应数据源或私网场景提供配置访问或摄取端点；规则关联与目标表仍须单独验证。</text>
</svg>