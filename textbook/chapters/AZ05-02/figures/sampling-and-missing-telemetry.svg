<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#17324d"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="34" y="42" font-family="Aptos,Arial,sans-serif" font-size="27" font-weight="700" fill="#17324d" text-anchor="start">采样改变“保留了几行”和“代表了多少事件”的关系</text>
<text x="34" y="74" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="start">ItemCount 可加权还原代表数量的估计；采样不补回未插桩或未被采集的内容</text>
<rect x="52" y="158" width="280" height="140" rx="17" fill="#eaf1f8" stroke="#17324d" stroke-width="2.5"/>
<text x="192" y="192" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#17324d" text-anchor="middle">原始遥测</text>
<text x="192" y="225" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">4 个 checkout 请求</text>
<text x="192" y="251" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">4 个 request spans</text>
<rect x="458" y="158" width="280" height="140" rx="17" fill="#fff3e5" stroke="#c96a18" stroke-width="2.5"/>
<text x="598" y="192" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#c96a18" text-anchor="middle">采样后保留</text>
<text x="598" y="225" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">存储 1 行</text>
<text x="598" y="251" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">ItemCount = 4</text>
<rect x="864" y="158" width="280" height="140" rx="17" fill="#eaf6ef" stroke="#23764d" stroke-width="2.5"/>
<text x="1004" y="192" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#23764d" text-anchor="middle">KQL 聚合</text>
<text x="1004" y="225" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">count() = 1 行</text>
<text x="1004" y="251" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">sum(ItemCount) = 4</text>
<path d="M332,228 L448,228" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M738,228 L854,228" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="72" y="364" width="1056" height="90" rx="16" fill="#fff0f1" stroke="#aa4052" stroke-width="2"/>
<text x="600" y="400" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#aa4052" text-anchor="middle">若依赖 span 不见了：检查插桩 / exporter / sampling / ingestion / 表与 scope / 时间过滤。</text>
<text x="600" y="435" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="700" fill="#17324d" text-anchor="middle">“当前查询没有行”只能证明该查询没有返回行，不能证明请求或故障没发生。</text>
<text x="600" y="502" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#5d7183" text-anchor="middle">图中采样比例是用于解释 ItemCount 的教学例，不承诺特定 SDK 的每条 span 行为。</text>
</svg>