<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="440" viewBox="0 0 1300 440" role="img" aria-label="Azure CNI Overlay IP path and AKS CoreDNS service discovery">
<title>Azure CNI Overlay IP path and AKS CoreDNS service discovery</title><rect width="100%" height="100%" rx="20" fill="white"/>
<style>text{font-family:"Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;fill:#233747}.h{font-size:24px;font-weight:700;fill:#17354c}.sub{font-size:17px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#607585}.tiny{font-size:12px;fill:#607585}</style>
<defs><marker id="navy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#17354c"/></marker><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#008f95"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#e9963e"/></marker><marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#7356ba"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#d64a4a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#287a54"/></marker></defs>
<text x="650" y="40" class="h" text-anchor="middle">Overlay 地址、Service 发现和出站 NAT 是不同路径</text>
<rect x="45" y="82" width="1210" height="340" rx="18" fill="#f7fafb" stroke="#9eb5c3" stroke-width="2"/>
<text x="200" y="112" class="sub" text-anchor="middle" fill="#17354c">VNet node subnet</text>
<rect x="75" y="150" width="235" height="110" rx="14" fill="#edf2f7" stroke="#17354c" stroke-width="2"/>
<text x="192" y="180" class="sub" text-anchor="middle" fill="#17354c">Node VM · node IP</text>
<text x="192" y="208" class="small" text-anchor="middle">kubelet + CNI</text>
<text x="192" y="231" class="small" text-anchor="middle">VNet address</text>
<rect x="350" y="132" width="420" height="236" rx="16" fill="#f0f8f7" stroke="#008f95" stroke-width="2" stroke-dasharray="8 6"/>
<text x="560" y="158" class="sub" text-anchor="middle" fill="#008f95">Pod CIDR · Azure CNI Overlay</text>
<rect x="375" y="185" width="165" height="90" rx="14" fill="white" stroke="#008f95" stroke-width="2"/>
<text x="457" y="215" class="sub" text-anchor="middle" fill="#008f95">Pod A</text>
<text x="457" y="243" class="small" text-anchor="middle">overlay IP</text>
<text x="457" y="266" class="small" text-anchor="middle">app</text>
<rect x="580" y="185" width="165" height="90" rx="14" fill="white" stroke="#008f95" stroke-width="2"/>
<text x="662" y="215" class="sub" text-anchor="middle" fill="#008f95">Pod B</text>
<text x="662" y="243" class="small" text-anchor="middle">overlay IP</text>
<text x="662" y="266" class="small" text-anchor="middle">service</text>
<rect x="470" y="292" width="180" height="74" rx="14" fill="#f5f1fb" stroke="#7356ba" stroke-width="2"/>
<text x="560" y="322" class="sub" text-anchor="middle" fill="#7356ba">Service ClusterIP</text>
<text x="560" y="350" class="small" text-anchor="middle">selector → ready endpoints</text>
<path d="M540 230 L580 230" fill="none" stroke="#008f95" stroke-width="3" marker-end="url(#teal)"/>
<path d="M560 275 L560 292" fill="none" stroke="#7356ba" stroke-width="3" marker-end="url(#purple)"/>
<rect x="75" y="300" width="235" height="70" rx="14" fill="#f5f1fb" stroke="#7356ba" stroke-width="2"/>
<text x="192" y="330" class="sub" text-anchor="middle" fill="#7356ba">CoreDNS / LocalDNS</text>
<text x="192" y="358" class="small" text-anchor="middle">cluster.local → service</text>
<text x="192" y="381" class="small" text-anchor="middle">external query → upstream</text>
<path d="M375 215 L310 330" fill="none" stroke="#7356ba" stroke-width="3" marker-end="url(#purple)"/>
<rect x="900" y="147" width="300" height="95" rx="14" fill="#fff5e9" stroke="#e9963e" stroke-width="2"/>
<text x="1050" y="177" class="sub" text-anchor="middle" fill="#e9963e">VNet / on-prem / internet</text>
<text x="1050" y="205" class="small" text-anchor="middle">Pod egress SNAT uses node IP</text>
<text x="1050" y="228" class="small" text-anchor="middle">DNS, route, NSG and firewall still apply</text>
<path d="M745 225 L900 195" fill="none" stroke="#e9963e" stroke-width="3" marker-end="url(#orange)"/>
<rect x="900" y="290" width="300" height="80" rx="14" fill="#f0f7f2" stroke="#287a54" stroke-width="2"/>
<text x="1050" y="320" class="sub" text-anchor="middle" fill="#287a54">Ingress / LoadBalancer</text>
<text x="1050" y="348" class="small" text-anchor="middle">external request enters service layer</text>
<text x="1050" y="371" class="small" text-anchor="middle">no direct inbound to overlay Pod IP</text>
<path d="M900 320 L745 245" fill="none" stroke="#287a54" stroke-width="3" marker-end="url(#green)"/>
<text x="650" y="402" class="small" text-anchor="middle">Keep pod CIDR, node VNet, Service CIDR and connected networks non-overlapping.</text></svg>