<text x="380" y="342" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.4" font-weight="400" fill="#c0504d" text-anchor="middle">Storage Private Endpoint traffic can work while public network access is disabled; DNS alone grants neither reachability nor data access.</text>
<text x="380" y="362" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.9" font-weight="400" fill="#5d6d7a" text-anchor="middle">TLS/SNI implication is operational reasoning from the documented instruction to keep the original connection string; no TLS handshake is modeled.</text>
