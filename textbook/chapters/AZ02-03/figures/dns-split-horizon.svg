<text x="380" y="334" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.6" font-weight="400" fill="#c0504d" text-anchor="middle">The privatelink name participates in DNS resolution; do not replace the Storage endpoint URL with that alias.</text>
