<text x="282.0" y="275.8695" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.9" font-weight="400" fill="#22313d" text-anchor="middle">Link the same zone to each VNet that needs resolution; zone groups manage PE records.</text>
<text x="282.0" y="287.08750000000003" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="7.9" font-weight="400" fill="#22313d" text-anchor="middle">VNet links provide name resolution, not peering, routes, firewall passage, or data authorization.</text>
<text x="380" y="340" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.6" font-weight="400" fill="#5d6d7a" text-anchor="middle">A DNS forwarder or Azure Private Resolver is a topology choice; do not assume one exists or is free.</text>
