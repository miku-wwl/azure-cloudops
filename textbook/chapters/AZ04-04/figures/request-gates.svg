<path d="M680,433 L732,433" fill="none" stroke="#c96a18" stroke-width="3" marker-end="url(#arrow-c96a18)"/>
<path d="M1022,433 L1074,433" fill="none" stroke="#684bb1" stroke-width="3" marker-end="url(#arrow-684bb1)"/>
<text x="720" y="540" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="700" fill="#aa4052" text-anchor="middle">A valid token cannot repair DNS; a private route cannot grant database permission.</text>
