<rect width="100%" height="100%" fill="#ffffff"/>
<text x="34" y="46" font-family="Aptos,Arial,sans-serif" font-size="27" font-weight="700" fill="#17324d" text-anchor="start">访问请求需要通过连续的独立门</text>
<text x="34" y="77" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#5d7183" text-anchor="start">DNS 选路、网络准入、身份认证与数据授权、对象/数据库状态不能互相作证</text>
<rect x="28" y="110" width="1384" height="190" rx="20" fill="#f6f9fb" stroke="#d3e0e7"/>
<rect x="28" y="325" width="1384" height="190" rx="20" fill="#f6f9fb" stroke="#d3e0e7"/>
<text x="52" y="145" font-family="Aptos,Arial,sans-serif" font-size="20" font-weight="700" fill="#087f8c" text-anchor="start">Azure Storage / Blob</text>
<text x="52" y="360" font-family="Aptos,Arial,sans-serif" font-size="20" font-weight="700" fill="#684bb1" text-anchor="start">Azure SQL Database</text>
<rect x="58" y="169" width="280" height="98" rx="17" fill="#edf5f7" stroke="#087f8c" stroke-width="2.2"/>
<text x="198" y="201" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#087f8c" text-anchor="middle">1 · DNS / endpoint</text>
<text x="198" y="230" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">normal FQDN → private or public IP</text>
<text x="198" y="255" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">Blob / DFS subresource</text>
<rect x="400" y="169" width="280" height="98" rx="17" fill="#fff3e5" stroke="#c96a18" stroke-width="2.2"/>
<text x="540" y="201" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#c96a18" text-anchor="middle">2 · Network path</text>
<text x="540" y="230" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">private route or public firewall</text>
<text x="540" y="255" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">source, NSG, NVA, HTTPS</text>
<rect x="742" y="169" width="280" height="98" rx="17" fill="#f2edfb" stroke="#684bb1" stroke-width="2.2"/>
<text x="882" y="201" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#684bb1" text-anchor="middle">3 · Auth + data grant</text>
<text x="882" y="230" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">Entra + Blob data role</text>
<text x="882" y="255" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">or approved SAS / key mode</text>
<rect x="1084" y="169" width="280" height="98" rx="17" fill="#eaf6ef" stroke="#23764d" stroke-width="2.2"/>
<text x="1224" y="201" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#23764d" text-anchor="middle">4 · Object state</text>
<text x="1224" y="230" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">name, version, deleted state</text>
<text x="1224" y="255" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">and operation permission</text>
<rect x="58" y="384" width="280" height="98" rx="17" fill="#edf5f7" stroke="#087f8c" stroke-width="2.2"/>
<text x="198" y="416" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#087f8c" text-anchor="middle">1 · DNS / endpoint</text>
<text x="198" y="445" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">logical-server FQDN</text>
<text x="198" y="470" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">private or public endpoint</text>
<rect x="400" y="384" width="280" height="98" rx="17" fill="#fff3e5" stroke="#c96a18" stroke-width="2.2"/>
<text x="540" y="416" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#c96a18" text-anchor="middle">2 · Network path</text>
<text x="540" y="445" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">firewall / PE / TCP policy</text>
<text x="540" y="470" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">1433 and possible redirect</text>
<rect x="742" y="384" width="280" height="98" rx="17" fill="#f2edfb" stroke="#684bb1" stroke-width="2.2"/>
<text x="882" y="416" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#684bb1" text-anchor="middle">3 · Auth + SQL grant</text>
<text x="882" y="445" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">Entra or SQL authentication</text>
<text x="882" y="470" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">database principal + permission</text>
<rect x="1084" y="384" width="280" height="98" rx="17" fill="#eaf6ef" stroke="#23764d" stroke-width="2.2"/>
<text x="1224" y="416" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#23764d" text-anchor="middle">4 · Database state</text>
<text x="1224" y="445" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">database, schema, data</text>
<text x="1224" y="470" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">or verified restore target</text>
