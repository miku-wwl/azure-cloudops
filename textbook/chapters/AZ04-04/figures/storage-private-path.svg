<rect width="100%" height="100%" fill="#ffffff"/>
<text x="34" y="46" font-family="Aptos,Arial,sans-serif" font-size="27" font-weight="700" fill="#17324d" text-anchor="start">Storage Private Endpoint 改变目标 IP，不改应用 FQDN</text>
<text x="34" y="77" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#5d7183" text-anchor="start">DNS 视图决定客户端走私有链路还是公共端点；Storage firewall 管的是公共端点</text>
<rect x="36" y="190" width="250" height="116" rx="17" fill="#eaf1f8" stroke="#17324d" stroke-width="2.2"/>
<text x="161" y="222" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#17324d" text-anchor="middle">Workload</text>
<text x="161" y="251" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">https://acct.blob.core.windows.net</text>
<text x="161" y="276" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">使用标准 service FQDN</text>
<rect x="340" y="162" width="326" height="160" rx="17" fill="#edf5f7" stroke="#087f8c" stroke-width="2.2"/>
<text x="503" y="194" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#087f8c" text-anchor="middle">DNS resolution</text>
<text x="503" y="223" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">CNAME → privatelink 子域</text>
<text x="503" y="248" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">private DNS A record</text>
<text x="503" y="273" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">返回 endpoint private IP</text>
<rect x="742" y="134" width="300" height="120" rx="17" fill="#eaf6ef" stroke="#23764d" stroke-width="2.2"/>
<text x="892" y="166" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#23764d" text-anchor="middle">Private Endpoint</text>
<text x="892" y="195" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">blob subresource NIC</text>
<text x="892" y="220" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">VNet 内部私有 IP</text>
<rect x="1098" y="134" width="300" height="120" rx="17" fill="#eaf6ef" stroke="#23764d" stroke-width="2.2"/>
<text x="1248" y="166" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#23764d" text-anchor="middle">Blob service</text>
<text x="1248" y="195" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">Private Link data path</text>
<text x="1248" y="220" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#273b4d" text-anchor="middle">Storage firewall 不控制 PE 流量</text>
<path d="M286,248 L330,248" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow-17324d)"/>
<path d="M666,235 L732,205" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-087f8c)"/>
<path d="M1042,194 L1088,194" fill="none" stroke="#23764d" stroke-width="3" marker-end="url(#arrow-23764d)"/>
<rect x="742" y="345" width="300" height="104" rx="17" fill="#fff3e5" stroke="#c96a18" stroke-width="2.2"/>
<text x="892" y="377" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#c96a18" text-anchor="middle">Public endpoint</text>
<text x="892" y="406" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">只在设计允许时使用</text>
<text x="892" y="431" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">selected networks / IP rules</text>
<rect x="1098" y="345" width="300" height="104" rx="17" fill="#fff3e5" stroke="#c96a18" stroke-width="2.2"/>
<text x="1248" y="377" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#c96a18" text-anchor="middle">Storage firewall</text>
<text x="1248" y="406" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">default Deny + 明确 allow</text>
<text x="1248" y="431" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#273b4d" text-anchor="middle">public network access Disabled 时拒绝</text>
<path d="M666,275 L732,385" fill="none" stroke="#c96a18" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-c96a18)"/>
<path d="M1042,397 L1088,397" fill="none" stroke="#c96a18" stroke-width="3" marker-end="url(#arrow-c96a18)"/>
<text x="340" y="400" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="700" fill="#aa4052" text-anchor="start">DNS 若仍返回 public IP</text>
<text x="340" y="430" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="400" fill="#aa4052" text-anchor="start">private-only workload 会走错端点</text>
<text x="720" y="500" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="middle">Blob 与 DFS 是不同 subresource；ADLS 操作可能需要两者。Service Endpoint 仍连接 public endpoint。</text>
</svg>