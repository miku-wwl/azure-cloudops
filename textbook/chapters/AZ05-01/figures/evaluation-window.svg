<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#17324d"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="34" y="42" font-family="Aptos,Arial,sans-serif" font-size="27" font-weight="700" fill="#17324d" text-anchor="start">检查频率决定何时评估；回看窗口决定每次取多长的数据</text>
<text x="34" y="74" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="start">示例采用每 1 分钟检查、回看 3 分钟；Azure 指标采样和服务延迟不由这张示意图决定</text>
<text x="54" y="138" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="700" fill="#5d7183" text-anchor="start">分钟</text>
<path d="M100,180 L1100,180" stroke="#91a7b6" stroke-width="2"/>
<path d="M180,168 L180,192" stroke="#91a7b6" stroke-width="2"/><text x="180" y="157" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="middle">0</text>
<path d="M360,168 L360,192" stroke="#91a7b6" stroke-width="2"/><text x="360" y="157" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="middle">1</text>
<path d="M540,168 L540,192" stroke="#91a7b6" stroke-width="2"/><text x="540" y="157" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="middle">2</text>
<path d="M720,168 L720,192" stroke="#91a7b6" stroke-width="2"/><text x="720" y="157" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="middle">3</text>
<path d="M900,168 L900,192" stroke="#91a7b6" stroke-width="2"/><text x="900" y="157" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="middle">4</text>
<path d="M1080,168 L1080,192" stroke="#91a7b6" stroke-width="2"/><text x="1080" y="157" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="middle">5</text>
<circle cx="180" cy="180" r="9" fill="#087f8c"/>
<circle cx="360" cy="180" r="9" fill="#087f8c"/>
<circle cx="540" cy="180" r="9" fill="#087f8c"/>
<circle cx="720" cy="180" r="9" fill="#087f8c"/>
<circle cx="900" cy="180" r="9" fill="#087f8c"/>
<circle cx="1080" cy="180" r="9" fill="#087f8c"/>
<rect x="181" y="224" width="539" height="58" rx="12" fill="#eaf6ef" stroke="#23764d" stroke-width="2"/>
<text x="450" y="260" font-family="Aptos,Arial,sans-serif" font-size="20" font-weight="700" fill="#23764d" text-anchor="middle">评估时刻 t=3：窗口 (0, 3]</text>
<rect x="361" y="308" width="539" height="58" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/>
<text x="630" y="344" font-family="Aptos,Arial,sans-serif" font-size="20" font-weight="700" fill="#087f8c" text-anchor="middle">评估时刻 t=4：窗口 (1, 4]</text>
<rect x="541" y="392" width="539" height="58" rx="12" fill="#fff3e5" stroke="#c96a18" stroke-width="2"/>
<text x="810" y="428" font-family="Aptos,Arial,sans-serif" font-size="20" font-weight="700" fill="#c96a18" text-anchor="middle">评估时刻 t=5：窗口 (2, 5]</text>
<text x="600" y="502" font-family="Aptos,Arial,sans-serif" font-size="20" font-weight="700" fill="#17324d" text-anchor="middle">窗口彼此重叠；同一数据点可能出现在多次评估里。检查频率 ≠ 回看时长。</text>
<text x="600" y="540" font-family="Aptos,Arial,sans-serif" font-size="16" font-weight="400" fill="#5d7183" text-anchor="middle">本地练习用规则桶演示边界，不模拟 Azure 指标预聚合、延迟或缺失数据策略。</text>
</svg>