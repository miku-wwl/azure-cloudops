<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#17324d"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="34" y="42" font-family="Aptos,Arial,sans-serif" font-size="27" font-weight="700" fill="#17324d" text-anchor="start">指标告警是一条从时间序列到独立告警条件的处理链</text>
<text x="34" y="74" font-family="Aptos,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7183" text-anchor="start">先确定数据系列和聚合，再看阈值如何评估；通知位于检测之后</text>
<rect x="30" y="170" width="210" height="132" rx="17" fill="#edf5f7" stroke="#087f8c" stroke-width="2.5"/>
<text x="135" y="204" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#087f8c" text-anchor="middle">Resource metric</text>
<text x="135" y="238" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">metric name + namespace</text>
<text x="135" y="265" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">time, value, dimensions</text>
<rect x="278" y="170" width="210" height="132" rx="17" fill="#f2edfb" stroke="#684bb1" stroke-width="2.5"/>
<text x="383" y="204" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#684bb1" text-anchor="middle">Series selection</text>
<text x="383" y="238" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">resource scope</text>
<text x="383" y="265" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">split or roll up dimensions</text>
<rect x="526" y="170" width="210" height="132" rx="17" fill="#fff3e5" stroke="#c96a18" stroke-width="2.5"/>
<text x="631" y="204" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#c96a18" text-anchor="middle">Rule evaluation</text>
<text x="631" y="238" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">aggregation + lookback</text>
<text x="631" y="265" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">operator + threshold</text>
<rect x="774" y="170" width="180" height="132" rx="17" fill="#fff0f1" stroke="#aa4052" stroke-width="2.5"/>
<text x="864" y="204" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#aa4052" text-anchor="middle">Alert condition</text>
<text x="864" y="238" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">Fired / Resolved</text>
<text x="864" y="265" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">stateful or stateless</text>
<rect x="990" y="170" width="180" height="132" rx="17" fill="#eaf6ef" stroke="#23764d" stroke-width="2.5"/>
<text x="1080" y="204" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#23764d" text-anchor="middle">Response</text>
<text x="1080" y="238" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">action group</text>
<text x="1080" y="265" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="400" fill="#273b4d" text-anchor="middle">processing rules</text>
<path d="M240,236 L268,236" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M488,236 L516,236" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M736,236 L764,236" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M954,236 L980,236" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="870" y="365" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="700" fill="#aa4052" text-anchor="middle">检测条件</text>
<text x="1080" y="365" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="700" fill="#23764d" text-anchor="middle">通知与抑制</text>
<path d="M870,330 L870,383" fill="none" stroke="#aa4052" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<path d="M1080,330 L1080,383" fill="none" stroke="#23764d" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text x="600" y="455" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="700" fill="#17324d" text-anchor="middle">告警规则回答“条件是否成立”；通知处理回答“成立后如何响应”。</text>
</svg>