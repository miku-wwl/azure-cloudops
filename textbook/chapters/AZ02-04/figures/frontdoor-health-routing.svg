<text x="188.0" y="222.4" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="700" fill="#1f5c3d" text-anchor="middle">Primary unhealthy; backup healthy</text>
<text x="188.0" y="242.69" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.3" font-weight="400" fill="#22313d" text-anchor="middle">probe removes priority 1</text>
<text x="188.0" y="259.69" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.3" font-weight="400" fill="#22313d" text-anchor="middle">priority 2 becomes eligible</text>
<text x="188.0" y="276.69" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.3" font-weight="400" fill="#22313d" text-anchor="middle">actual request path still needs evidence</text>
<rect x="432" y="203" width="280" height="96" rx="8" ry="8" fill="#fbeceb" stroke="#c0504d" stroke-width="1.4"/>
<text x="572.0" y="222.4" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="700" fill="#8e2f2c" text-anchor="middle">Every enabled origin unhealthy</text>
<text x="572.0" y="242.69" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.3" font-weight="400" fill="#22313d" text-anchor="middle">documented fallback: round-robin</text>
<text x="572.0" y="259.69" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.3" font-weight="400" fill="#22313d" text-anchor="middle">across all origins</text>
<text x="572.0" y="276.69" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.3" font-weight="400" fill="#22313d" text-anchor="middle">do not assume fail-closed behavior</text>
<text x="380" y="343" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.8" font-weight="400" fill="#5d6d7a" text-anchor="middle">Health-probe output and client request logs answer different questions; the local model reports only a candidate set.</text>
