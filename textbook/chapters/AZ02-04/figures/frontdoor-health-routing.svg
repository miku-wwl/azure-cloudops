<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
<defs><marker id="marrow1d3b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#1d3b53"/></marker></defs>
<text x="380" y="23" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#1d3b53" text-anchor="middle">Front Door 先判断 origin 健康，再决定请求候选范围</text>
<rect x="18" y="65" width="128" height="90" rx="8" ry="8" fill="#e9eff5" stroke="#1d3b53" stroke-width="1.4"/>
<text x="82.0" y="84.6" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="700" fill="#17384f" text-anchor="middle">可用 origin</text>
<text x="82.0" y="103.96" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.1" font-weight="400" fill="#22313d" text-anchor="middle">enabled + probe healthy</text>
<text x="82.0" y="119.96" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.1" font-weight="400" fill="#22313d" text-anchor="middle">HTTP(S) 默认要求 200</text>
<rect x="168" y="65" width="128" height="90" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="232.0" y="84.6" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="700" fill="#12676b" text-anchor="middle">Priority</text>
<text x="232.0" y="103.96" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.1" font-weight="400" fill="#22313d" text-anchor="middle">保留数字最小的</text>
<text x="232.0" y="119.96" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.1" font-weight="400" fill="#22313d" text-anchor="middle">健康优先级组</text>
<rect x="318" y="65" width="128" height="90" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="382.0" y="84.6" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="700" fill="#12676b" text-anchor="middle">Latency</text>
<text x="382.0" y="103.96" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.1" font-weight="400" fill="#22313d" text-anchor="middle">保留 sensitivity</text>
<text x="382.0" y="119.96" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.1" font-weight="400" fill="#22313d" text-anchor="middle">范围内的 origin</text>
<rect x="468" y="65" width="128" height="90" rx="8" ry="8" fill="#fdf1e3" stroke="#e0954a" stroke-width="1.4"/>
<text x="532.0" y="84.6" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="700" fill="#9a5a1c" text-anchor="middle">Weight</text>
<text x="532.0" y="103.96" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.1" font-weight="400" fill="#22313d" text-anchor="middle">在最终候选间</text>
<text x="532.0" y="119.96" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.1" font-weight="400" fill="#22313d" text-anchor="middle">按权重分配</text>
<rect x="618" y="65" width="128" height="90" rx="8" ry="8" fill="#eaf5ee" stroke="#2e7d55" stroke-width="1.4"/>
<text x="682.0" y="84.6" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="700" fill="#1f5c3d" text-anchor="middle">请求候选集</text>
<text x="682.0" y="103.96" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.1" font-weight="400" fill="#22313d" text-anchor="middle">session affinity</text>
<text x="682.0" y="119.96" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.1" font-weight="400" fill="#22313d" text-anchor="middle">可能固定后续请求</text>
