<text x="380" y="22" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#1d3b53" text-anchor="middle">从业务目标到恢复证据：SLO 指标与恢复门槛各有分母</text>
