<text x="380" y="194" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.5" font-weight="600" fill="#c0504d" text-anchor="middle">SLA 是供应方按条件作出的服务承诺；不能代替用户关键流 SLO，也不证明恢复完成。</text>
<text x="380" y="220" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.8" font-weight="400" fill="#5d6d7a" text-anchor="middle">分钟型 error budget 只适用于时间型 availability SLI；request-based SLI 按请求分母计算。</text>
